<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Dialogue System v3.6</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0a0a0a; height: 100vh; overflow: hidden; color: #e0e0e0; }
        .main-container { display: flex; flex-direction: column; height: 100vh; }
        .status-bar { background: rgba(15, 15, 15, 0.9); border-bottom: 1px solid #333; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; min-height: 50px; flex-wrap: wrap; gap: 10px; }
        .status-left { display: flex; align-items: center; gap: 15px; flex: 1; }
        
        /* 设置按钮样式 */
        .settings-btn { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            flex-shrink: 0; 
            padding: 6px 12px; 
            background: rgba(30, 30, 30, 0.8); 
            border: 1px solid #333; 
            border-radius: 6px; 
            color: #4A90E2; 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 13px; 
            cursor: pointer; 
            transition: all 0.3s ease;
        }
        .settings-btn:hover { 
            border-color: #4A90E2; 
            background: rgba(74, 144, 226, 0.2); 
        }
        
        /* 设置面板遮罩 */
        .settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .settings-overlay.show { display: flex; }
        
        /* 设置面板 */
        .settings-panel {
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid #333;
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        .settings-header {
            padding: 20px 24px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .settings-title {
            font-size: 18px;
            font-weight: 600;
            color: #f1f5f9;
        }
        .settings-close {
            background: none;
            border: none;
            color: #666;
            font-size: 24px;
            cursor: pointer;
            line-height: 1;
            transition: color 0.2s;
        }
        .settings-close:hover { color: #ff4444; }
        
        .settings-body {
            padding: 24px;
        }
        
        .model-config-section {
            margin-bottom: 24px;
            padding: 16px;
            background: rgba(30, 30, 30, 0.5);
            border-radius: 12px;
            border: 1px solid #333;
        }
        .model-config-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            color: #4A90E2;
            margin-bottom: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .model-config-title.dual-mode-badge::after {
            content: "对战模式";
            font-size: 11px;
            color: #00ff41;
            background: rgba(0, 255, 65, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid rgba(0, 255, 65, 0.3);
        }
        
        .input-group {
            margin-bottom: 16px;
        }
        .input-group:last-child { margin-bottom: 0; }
        .input-label {
            display: block;
            font-size: 13px;
            color: #888;
            margin-bottom: 6px;
            font-family: 'JetBrains Mono', monospace;
        }
        .input-field {
            width: 100%;
            padding: 10px 14px;
            background: rgba(15, 15, 15, 0.8);
            border: 1px solid #333;
            border-radius: 8px;
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }
        .input-field:focus {
            border-color: #4A90E2;
            background: rgba(15, 15, 15, 1);
        }
        .input-field::placeholder { color: #555; }
        
        .settings-footer {
            padding: 16px 24px;
            border-top: 1px solid #333;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }
        .settings-save-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #4A90E2 0%, #3B7BD5 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        .settings-save-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .settings-cancel-btn {
            padding: 10px 20px;
            background: rgba(30, 30, 30, 0.8);
            border: 1px solid #333;
            border-radius: 8px;
            color: #888;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .settings-cancel-btn:hover { border-color: #666; color: #f1f5f9; }
        
        .status-indicator { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #888; flex-shrink: 0; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #555; transition: all 0.3s ease; }
        .status-dot.active { background: #00ff41; box-shadow: 0 0 10px #00ff41; }
        .status-dot.thinking { background: #ffaa00; box-shadow: 0 0 10px #ffaa00; animation: pulse 1s infinite; }
        .status-dot.thinking-long { background: #ff6b00; box-shadow: 0 0 10px #ff6b00; animation: pulse 0.5s infinite; }
        .model-name-display { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #4A90E2; font-weight: 500; }
        .stats { display: flex; gap: 20px; font-size: 12px; color: #666; font-family: 'JetBrains Mono', monospace; }
        .chat-container { flex: 1; overflow-y: auto; padding: 25px 20px; scroll-behavior: smooth; }
        .message { display: flex; margin-bottom: 24px; animation: fadeIn 0.3s ease-out; }
        .message.user { justify-content: flex-end; }
        .message-bubble { max-width: 84%; padding: 14px 18px; border-radius: 18px; word-wrap: break-word; white-space: pre-wrap; line-height: 1.6; font-size: 15px; }
        .message.user .message-bubble { background: linear-gradient(135deg, #4A90E2 0%, #3B7BD5 100%); color: white; border-bottom-right-radius: 6px; }
        .message.ai .message-bubble { background: rgba(30, 30, 30, 0.8); color: #f1f5f9; border: 1px solid #333; border-bottom-left-radius: 6px; }
        .message.ai.dual-mode .message-bubble::before { content: attr(data-model-name); display: block; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #888; margin-bottom: 6px; font-weight: 600; }
        .message.grok .message-bubble { border-left: 3px solid #ffaa00; background: rgba(50, 40, 30, 0.6); }
        .message.nano .message-bubble { border-left: 3px solid #00bcd4; background: rgba(20, 40, 50, 0.6); }
        .message.gemini .message-bubble { border-left: 3px solid #4A90E2; background: rgba(30, 30, 50, 0.6); }
        .message.pro .message-bubble { border-left: 3px solid #00ff41; background: rgba(20, 40, 20, 0.6); }
        .message-footer { font-size: 11px; color: #555; margin-top: 6px; display: flex; justify-content: space-between; align-items: center; }
        .token-info { font-family: 'JetBrains Mono', monospace; color: #4A90E2; font-weight: 600; }
        
        /* ===== 新增：复制按钮样式 ===== */
        .copy-btn-container { position: relative; display: inline-block; }
        .copy-btn { 
            background: rgba(30, 30, 30, 0.9); 
            border: 1px solid #333; 
            color: #888; 
            padding: 3px 8px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 11px; 
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.2s ease;
            margin-left: 8px;
        }
        .copy-btn:hover { 
            background: rgba(74, 144, 226, 0.2); 
            border-color: #4A90E2; 
            color: #4A90E2; 
        }
        .copy-btn.copied { 
            background: rgba(0, 255, 65, 0.15); 
            border-color: #00ff41; 
            color: #00ff41; 
        }
        .copy-tooltip {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 15, 15, 0.95);
            border: 1px solid #333;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 10px;
            color: #888;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease;
            margin-bottom: 5px;
        }
        .copy-btn:hover .copy-tooltip { opacity: 1; visibility: visible; }
        
        .input-area { background: rgba(15, 15, 15, 0.9); border-top: 1px solid #333; padding: 18px 24px; display: flex; gap: 12px; align-items: flex-end; }
        .message-input { flex: 1; min-height: 48px; max-height: 200px; padding: 12px 16px; border: 1px solid #333; border-radius: 24px; font-size: 15px; resize: none; outline: none; background: rgba(30, 30, 30, 0.5); color: #f1f5f9; font-family: 'Inter', sans-serif; }
        .message-input:focus { border-color: #4A90E2; background: rgba(30, 30, 30, 0.8); }
        .message-input.dual-mode { background: rgba(20, 30, 20, 0.5); color: #00ff41; }
        .message-input.dual-mode:focus { border-color: #00ff41; background: rgba(20, 30, 20, 0.8); box-shadow: 0 0 0 2px rgba(0, 255, 65, 0.2); }
        .send-btn { width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer; background: linear-gradient(135deg, #4A90E2 0%, #00ff41 100%); color: #000; font-weight: bold; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; }
        .send-btn:disabled { background: #555 !important; color: #222; cursor: not-allowed; transform: none !important; }
        .send-btn.pro-mode { background: linear-gradient(135deg, #00ff41 0%, #4A90E2 100%); }
        .send-btn:hover:not(:disabled) { transform: scale(1.05); }
        .typing-indicator { display: flex; gap: 4px; padding: 14px 18px; background: rgba(30, 30, 30, 0.8); border-radius: 18px; border-bottom-left-radius: 6px; width: fit-content; border: 1px solid #333; }
        .typing-dot { width: 8px; height: 8px; border-radius: 50%; background: #4A90E2; animation: typingBounce 1.4s infinite; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .mode-switcher { position: fixed; top: 12px; right: 24px; z-index: 100; display: flex; align-items: center; gap: 8px; background: rgba(15, 15, 15, 0.9); padding: 6px 12px; border-radius: 20px; border: 1px solid #333; }
        .switch { position: relative; width: 40px; height: 22px; background: #333; border-radius: 11px; cursor: pointer; transition: background 0.3s ease; }
        .switch.active { background: #4A90E2; }
        .switch-slider { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; background: white; border-radius: 50%; transition: transform 0.3s ease; }
        .switch.active .switch-slider { transform: translateX(18px); }
        .dual-model-controls { background: rgba(15, 15, 15, 0.9); padding: 12px 24px; border-top: 1px solid #333; display: none; align-items: center; gap: 12px; font-size: 13px; flex-wrap: wrap; }
        .dual-model-controls.show { display: flex; }
        .round-counter { font-family: 'JetBrains Mono', monospace; color: #00ff41; font-weight: 600; margin-right: auto; font-size: 14px; }
        .control-btn { padding: 6px 12px; border: 1px solid #333; background: rgba(30, 30, 30, 0.8); color: #888; border-radius: 6px; cursor: pointer; font-size: 12px; transition: all 0.3s ease; white-space: nowrap; min-height: 44px; }
        .control-btn:hover { border-color: #4A90E2; color: #4A90E2; background: rgba(74, 144, 226, 0.2); }
        .mode-hint { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); background: rgba(15, 15, 15, 0.9); border: 1px solid #333; border-radius: 10px; padding: 8px 12px; font-size: 12px; color: #888; display: none; z-index: 10; white-space: nowrap; }
        .mode-hint.show { display: block; }
        @media (max-width: 768px) { .message-bubble { max-width: 90%; font-size: 14px; } .stats { display: none; } .status-bar { padding: 8px 16px; gap: 8px; } .status-left { gap: 8px; width: 100%; justify-content: space-between; } .model-name-display { display: none; } .mode-switcher { top: 8px; right: 12px; padding: 4px 8px; gap: 6px; } .switch { width: 36px; height: 20px; } .switch-slider { width: 16px; height: 16px; } .switch.active .switch-slider { transform: translateX(16px); } .dual-model-controls { padding: 10px 16px; gap: 8px; } .control-btn { font-size: 11px; padding: 5px 10px; } .mode-hint { bottom: 60px; font-size: 11px; padding: 6px 10px; } .settings-panel { max-width: 95vw; } }
    </style>
</head>
<body>
    <!-- 对战模式切换开关 -->
    <div class="mode-switcher" id="modeSwitchContainer">
        <span class="switch-label">单模型</span>
        <div class="switch" id="modeSwitch" onclick="toggleDualModelMode()">
            <div class="switch-slider"></div>
        </div>
        <span class="switch-label">对战</span>
    </div>

    <!-- 智能模式提示 -->
    <div class="mode-hint" id="modeHint"></div>

    <!-- 设置面板遮罩 -->
    <div class="settings-overlay" id="settingsOverlay" onclick="closeSettings(event)">
        <div class="settings-panel" onclick="event.stopPropagation()">
            <div class="settings-header">
                <span class="settings-title" id="settingsTitle">模型设置</span>
                <button class="settings-close" onclick="closeSettings()">&times;</button>
            </div>
            <div class="settings-body">
                <!-- 单模型设置 -->
                <div id="singleModelSettings">
                    <div class="model-config-section">
                        <div class="model-config-title">单模型配置</div>
                        <div class="input-group">
                            <label class="input-label">模型名称</label>
                            <input type="text" class="input-field" id="singleModelName" placeholder="例如: gpt-4, claude-3-opus">
                        </div>
                        <div class="input-group">
                            <label class="input-label">API URL</label>
                            <input type="text" class="input-field" id="singleModelUrl" placeholder="https://api.example.com/v1/chat/completions">
                        </div>
                        <div class="input-group">
                            <label class="input-label">API 密钥</label>
                            <input type="password" class="input-field" id="singleModelKey" placeholder="sk-xxxxxxxxxxxxxxxx">
                        </div>
                    </div>
                </div>
                
                <!-- 双模型设置 -->
                <div id="dualModelSettings" style="display: none;">
                    <div class="model-config-section">
                        <div class="model-config-title dual-mode-badge">模型 A (先手)</div>
                        <div class="input-group">
                            <label class="input-label">模型名称</label>
                            <input type="text" class="input-field" id="dualModelAName" placeholder="例如: gpt-4">
                        </div>
                        <div class="input-group">
                            <label class="input-label">API URL</label>
                            <input type="text" class="input-field" id="dualModelAUrl" placeholder="https://api.example.com/v1/chat/completions">
                        </div>
                        <div class="input-group">
                            <label class="input-label">API 密钥</label>
                            <input type="password" class="input-field" id="dualModelAKey" placeholder="sk-xxxxxxxxxxxxxxxx">
                        </div>
                    </div>
                    
                    <div class="model-config-section">
                        <div class="model-config-title" style="color: #ffaa00;">模型 B (后手)</div>
                        <div class="input-group">
                            <label class="input-label">模型名称</label>
                            <input type="text" class="input-field" id="dualModelBName" placeholder="例如: claude-3-opus">
                        </div>
                        <div class="input-group">
                            <label class="input-label">API URL</label>
                            <input type="text" class="input-field" id="dualModelBUrl" placeholder="https://api.example.com/v1/chat/completions">
                        </div>
                        <div class="input-group">
                            <label class="input-label">API 密钥</label>
                            <input type="password" class="input-field" id="dualModelBKey" placeholder="sk-xxxxxxxxxxxxxxxx">
                        </div>
                    </div>
                </div>
            </div>
            <div class="settings-footer">
                <button class="settings-cancel-btn" onclick="closeSettings()">取消</button>
                <button class="settings-save-btn" onclick="saveSettings()">保存设置</button>
            </div>
        </div>
    </div>

    <!-- 主界面 -->
    <div class="main-container" id="mainContainer">
        <!-- 顶部状态栏 -->
        <div class="status-bar">
            <div class="status-left">
                <!-- 设置按钮替代模型选择框 -->
                <button class="settings-btn" onclick="openSettings()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                    模型设置
                </button>
                
                <div class="status-indicator">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">空闲</span>
                </div>
                <div class="model-name-display" id="modelNameDisplay">未配置</div>
            </div>
            <div class="stats">
                <div class="stat-item">
                    <span>Tokens:</span>
                    <span class="stat-value" id="tokenCount">0/4000</span>
                </div>
                <div class="stat-item">
                    <span>响应:</span>
                    <span class="stat-value" id="responseTime">-</span>
                </div>
            </div>
        </div>

        <!-- 对话区 -->
        <div class="chat-container" id="chatContainer"></div>

        <!-- 对战模式控制面板 -->
        <div class="dual-model-controls" id="dualModelControls">
            <span class="round-counter" id="roundCounter">第 1 轮</span>
            <button class="control-btn" onclick="continueDualModelConversation()">继续下一轮</button>
            <button class="control-btn" onclick="summarizeDualModel()">总结观点</button>
            <button class="control-btn" onclick="endDualModelMode()">结束对战</button>
        </div>

        <div class="input-area">
            <textarea class="message-input" id="messageInput" placeholder="输入消息..." rows="1"></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="发送">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <script>
        // 默认配置
        const DEFAULT_CONFIG = {
            name: "未配置",
            apiUrl: "",
            apiKey: "",
            displayName: "Custom Model",
            maxTokens: 4000,
            isSlow: false
        };
        
        // 当前模型配置
        let currentModel = { ...DEFAULT_CONFIG };
        let conversationHistory = [], messageIdCounter = 0, tokenUsage = 0, requestStartTime = 0;
        let isDualModelMode = false, currentSpeaker = 'A', roundCount = 1, dualModelHistory = [], dualModelTopic = '';
        let thinkingTimer = null;
        
        // 双模型配置
        let dualModelConfig = {
            A: { ...DEFAULT_CONFIG, displayName: "Model A" },
            B: { ...DEFAULT_CONFIG, displayName: "Model B" }
        };

        document.addEventListener('DOMContentLoaded', function() {
            setupInputHandling();
            updateModelDisplay();
            
            // 尝试从本地存储加载设置
            loadSettingsFromStorage();
            
            setTimeout(() => {
                const configStatus = currentModel.apiUrl ? currentModel.name : "未配置（请点击上方\"模型设置\"进行配置）";
                addMessage(`🎯 系统已就绪

✅ 当前模型: ${configStatus}
✅ 智能对战模式
✅ 单输入框设计
✅ AI回复支持一键复制

请先点击左上角"模型设置"配置您的API信息`, false);
            }, 100);
        });
        
        // 设置相关函数
        function openSettings() {
            const overlay = document.getElementById('settingsOverlay');
            const singleSettings = document.getElementById('singleModelSettings');
            const dualSettings = document.getElementById('dualModelSettings');
            const title = document.getElementById('settingsTitle');
            
            if (isDualModelMode) {
                singleSettings.style.display = 'none';
                dualSettings.style.display = 'block';
                title.textContent = '对战模式模型设置';
                
                // 填充双模型设置
                document.getElementById('dualModelAName').value = dualModelConfig.A.name !== '未配置' ? dualModelConfig.A.name : '';
                document.getElementById('dualModelAUrl').value = dualModelConfig.A.apiUrl;
                document.getElementById('dualModelAKey').value = dualModelConfig.A.apiKey;
                document.getElementById('dualModelBName').value = dualModelConfig.B.name !== '未配置' ? dualModelConfig.B.name : '';
                document.getElementById('dualModelBUrl').value = dualModelConfig.B.apiUrl;
                document.getElementById('dualModelBKey').value = dualModelConfig.B.apiKey;
            } else {
                singleSettings.style.display = 'block';
                dualSettings.style.display = 'none';
                title.textContent = '单模型设置';
                
                // 填充单模型设置
                document.getElementById('singleModelName').value = currentModel.name !== '未配置' ? currentModel.name : '';
                document.getElementById('singleModelUrl').value = currentModel.apiUrl;
                document.getElementById('singleModelKey').value = currentModel.apiKey;
            }
            
            overlay.classList.add('show');
        }
        
        function closeSettings(event) {
            if (!event || event.target === event.currentTarget) {
                document.getElementById('settingsOverlay').classList.remove('show');
            }
        }
        
        function saveSettings() {
            if (isDualModelMode) {
                // 保存双模型设置
                const nameA = document.getElementById('dualModelAName').value.trim();
                const urlA = document.getElementById('dualModelAUrl').value.trim();
                const keyA = document.getElementById('dualModelAKey').value.trim();
                const nameB = document.getElementById('dualModelBName').value.trim();
                const urlB = document.getElementById('dualModelBUrl').value.trim();
                const keyB = document.getElementById('dualModelBKey').value.trim();
                
                if (!nameA || !urlA || !keyA || !nameB || !urlB || !keyB) {
                    alert('请填写完整的模型配置信息');
                    return;
                }
                
                dualModelConfig.A = {
                    ...DEFAULT_CONFIG,
                    name: nameA,
                    apiUrl: urlA,
                    apiKey: keyA,
                    displayName: nameA
                };
                dualModelConfig.B = {
                    ...DEFAULT_CONFIG,
                    name: nameB,
                    apiUrl: urlB,
                    apiKey: keyB,
                    displayName: nameB
                };
                
                addMessage(`✅ 对战模式模型已更新\n\n模型 A: ${nameA}\n模型 B: ${nameB}`, false);
            } else {
                // 保存单模型设置
                const name = document.getElementById('singleModelName').value.trim();
                const url = document.getElementById('singleModelUrl').value.trim();
                const key = document.getElementById('singleModelKey').value.trim();
                
                if (!name || !url || !key) {
                    alert('请填写完整的模型配置信息');
                    return;
                }
                
                currentModel = {
                    ...DEFAULT_CONFIG,
                    name: name,
                    apiUrl: url,
                    apiKey: key,
                    displayName: name
                };
                
                updateModelDisplay();
                addMessage(`✅ 模型配置已更新\n\n模型: ${name}\nURL: ${url}`, false);
            }
            
            // 保存到本地存储
            saveSettingsToStorage();
            closeSettings();
        }
        
        function saveSettingsToStorage() {
            try {
                localStorage.setItem('ai_dialogue_single_model', JSON.stringify(currentModel));
                localStorage.setItem('ai_dialogue_dual_model', JSON.stringify(dualModelConfig));
            } catch (e) {
                console.log('无法保存到本地存储');
            }
        }
        
        function loadSettingsFromStorage() {
            try {
                const single = localStorage.getItem('ai_dialogue_single_model');
                const dual = localStorage.getItem('ai_dialogue_dual_model');
                
                if (single) {
                    const parsed = JSON.parse(single);
                    if (parsed.apiUrl) currentModel = parsed;
                }
                if (dual) {
                    const parsed = JSON.parse(dual);
                    if (parsed.A && parsed.A.apiUrl) dualModelConfig.A = parsed.A;
                    if (parsed.B && parsed.B.apiUrl) dualModelConfig.B = parsed.B;
                }
                
                updateModelDisplay();
            } catch (e) {
                console.log('无法从本地存储加载设置');
            }
        }

        function updateSendButtonStyle() {
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.classList.remove('pro-mode', 'dual-mode');
            if (isDualModelMode) {
                sendBtn.classList.add('dual-mode');
            }
        }

        function toggleDualModelMode() {
            const switchEl = document.getElementById('modeSwitch'), 
                  controlsEl = document.getElementById('dualModelControls'), 
                  input = document.getElementById('messageInput'),
                  sendBtn = document.getElementById('sendBtn');
            
            isDualModelMode = !isDualModelMode;
            
            if (isDualModelMode) {
                switchEl.classList.add('active'); 
                controlsEl.classList.add('show'); 
                
                input.classList.add('dual-mode');
                sendBtn.classList.add('dual-mode');
                input.placeholder = dualModelTopic ? '作为主持人加入讨论...' : '输入讨论话题...';
                
                conversationHistory = []; 
                tokenUsage = 0; 
                updateTokenCount(); 
                document.getElementById('chatContainer').innerHTML = '';
                
                // 检查是否已配置双模型
                if (!dualModelConfig.A.apiUrl || !dualModelConfig.B.apiUrl) {
                    addMessage('⚠️ 请先点击"模型设置"配置两个对战模型', false);
                } else {
                    addMessage('🥊 智能对战模式已启动\n\n✅ 双模型对战已就绪\n✅ AI回复支持一键复制\n\n输入框已智能切换：\n- 首次输入：设为讨论话题\n- 后续输入：作为主持人加入讨论\n\n输入话题开始对战吧！', false);
                }
                showHint('智能模式：请输入讨论话题开始对战');
            } else {
                switchEl.classList.remove('active'); 
                controlsEl.classList.remove('show'); 
                
                input.classList.remove('dual-mode');
                sendBtn.classList.remove('dual-mode');
                updateSendButtonStyle();
                input.placeholder = '输入消息...';
                
                dualModelHistory = []; 
                dualModelTopic = ''; 
                roundCount = 1; 
                updateRoundCounter(); 
                currentSpeaker = 'A';
                
                addMessage('💬 已退出对战模式，返回单模型对话', false);
                hideHint();
            }
            
            updateModelDisplay();
        }

        function updateRoundCounter() { 
            document.getElementById('roundCounter').textContent = `第 ${roundCount} 轮`; 
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput'), 
                  message = input.value.trim();
            
            if (!message) return;
            
            // 检查模型配置
            if (!isDualModelMode && !currentModel.apiUrl) {
                addMessage('⚠️ 请先点击"模型设置"配置模型信息', false);
                return;
            }
            
            if (updateTokenCount() > 4000) { 
                addMessage('⚠️ Token使用量已接近上限', false); 
                return; 
            }
            
            input.value = ''; 
            input.style.height = 'auto';
            
            if (!isDualModelMode) {
                // 单模型模式
                if (!currentModel.apiUrl) {
                    addMessage('⚠️ 请先配置模型信息', false);
                    return;
                }
                
                addMessage(message, true); 
                conversationHistory.push({ role: 'user', content: message });
                requestStartTime = Date.now(); 
                setStatus('thinking');
                
                const loadingElement = addMessage('', false, true), 
                      sendBtn = document.getElementById('sendBtn');
                sendBtn.disabled = true;
                
                try {
                    const response = await fetch(currentModel.apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${currentModel.apiKey}` },
                        body: JSON.stringify({ 
                            model: currentModel.name, 
                            messages: conversationHistory, 
                            max_tokens: 4000, 
                            temperature: 0.7,
                            stream: false
                        })
                    });
                    
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    
                    const data = await response.json(), 
                          reply = data.choices[0].message?.content || '', 
                          responseTime = ((Date.now() - requestStartTime) / 1000).toFixed(1);
                    
                    document.getElementById('responseTime').textContent = responseTime + 's';
                    loadingElement.remove(); 
                    addMessage(reply, false, false, calculateTokens(reply));
                    conversationHistory.push({ role: 'assistant', content: reply }); 
                    updateTokenCount();
                } catch (error) {
                    loadingElement.remove(); 
                    addMessage(`❌ 请求失败：${error.message}`, false);
                } finally { 
                    sendBtn.disabled = false; 
                    setStatus('idle'); 
                }
            } else {
                // 双模型模式
                if (!dualModelConfig.A.apiUrl || !dualModelConfig.B.apiUrl) {
                    addMessage('⚠️ 请先点击"模型设置"配置两个对战模型', false);
                    return;
                }
                
                if (!dualModelTopic) {
                    dualModelTopic = message;
                    dualModelHistory = [{ role: 'user', content: message }];
                    
                    const topicMsg = addMessage(`🎯 讨论话题：${message}\n\n等待 ${dualModelConfig.A.displayName} 开场...`, false);
                    topicMsg.style.background = 'rgba(255, 255, 255, 0.05)'; 
                    topicMsg.style.border = '1px dashed #4A90E2';
                    
                    input.placeholder = '作为主持人加入讨论...';
                    showHint('智能模式：现在可以加入讨论或让AI继续');
                    
                    currentSpeaker = 'A'; 
                    roundCount = 1; 
                    updateRoundCounter();
                    await continueDualModelConversation();
                } else {
                    const discussMsg = addMessage(`💬 主持人：${message}`, true);
                    discussMsg.style.background = 'rgba(0, 255, 65, 0.1)'; 
                    discussMsg.style.border = '1px dashed #00ff41';
                    
                    dualModelHistory.push({ role: 'user', content: message, type: 'third_party_discussion' });
                    
                    const controls = document.querySelectorAll('.control-btn'); 
                    controls.forEach(btn => btn.disabled = true);
                    setStatus('thinking');
                    
                    const speakerModel = dualModelConfig[currentSpeaker];
                    
                    const recentHistory = dualModelHistory.slice(-6);
                    let historyText = `讨论话题: ${dualModelTopic}\n\n`;
                    
                    recentHistory.forEach((msg, index) => {
                        if (msg.role === 'assistant') {
                            const speaker = msg.model === 'A' ? dualModelConfig.A.displayName : dualModelConfig.B.displayName;
                            historyText += `${speaker}: ${msg.content.substring(0, 250)}`;
                        } else {
                            if (msg.type === 'third_party_discussion') {
                                historyText += `主持人: ${msg.content}`;
                            } else {
                                historyText += `用户: ${msg.content}`;
                            }
                        }
                        if (index < recentHistory.length - 1) historyText += '\n\n';
                    });
                    
                    const prompt = `讨论"${dualModelTopic}"中，主持人加入并发言。

**完整历史**：
${historyText}

**要求**：识别主持人观点，结合上下文回应，保持逻辑连贯。`;
                    
                    const loadingMsg = `[${speakerModel.displayName}] 思考回应...`;
                    const loadingElement = addMessage(loadingMsg, false, true); 
                    loadingElement.classList.add(currentSpeaker.toLowerCase() === 'a' ? 'gemini' : 'grok', 'dual-mode');
                    
                    try {
                        const response = await fetch(speakerModel.apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${speakerModel.apiKey}` },
                            body: JSON.stringify({ 
                                model: speakerModel.name, 
                                messages: [{ role: 'user', content: prompt }], 
                                max_tokens: 2000, 
                                temperature: 0.7,
                                stream: false
                            })
                        });
                        
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        
                        const data = await response.json(), 
                              reply = data.choices[0].message?.content || '';
                        
                        loadingElement.remove();
                        const messageElement = addMessage(reply, false, false, calculateTokens(reply));
                        messageElement.classList.add(currentSpeaker.toLowerCase() === 'a' ? 'gemini' : 'grok', 'dual-mode');
                        messageElement.querySelector('.message-bubble').setAttribute('data-model-name', `[${speakerModel.displayName} 回应主持人]`);
                        dualModelHistory.push({ role: 'assistant', content: reply, model: currentSpeaker });
                        currentSpeaker = currentSpeaker === 'A' ? 'B' : 'A';
                        roundCount++;
                        updateRoundCounter();
                    } catch (error) {
                        loadingElement.remove(); 
                        addMessage(`❌ ${speakerModel.displayName} 回应失败: ${error.message}`, false);
                    } finally { 
                        setStatus('idle'); 
                        controls.forEach(btn => btn.disabled = false); 
                    }
                }
            }
        }

        async function continueDualModelConversation() {
            // 检查配置
            if (!dualModelConfig.A.apiUrl || !dualModelConfig.B.apiUrl) {
                addMessage('⚠️ 请先配置双模型设置', false);
                return;
            }
            
            const controls = document.querySelectorAll('.control-btn'); 
            controls.forEach(btn => btn.disabled = true);
            setStatus('thinking');
            
            const speakerModel = dualModelConfig[currentSpeaker], 
                  opponentModel = currentSpeaker === 'A' ? 'B' : 'A';
            
            let prompt = '';
            if (dualModelHistory.length === 1) {
                prompt = `请就以下话题发表你的观点，要求逻辑清晰、论据充分：\n\n${dualModelTopic}`;
            } else {
                const combinedHistory = [];
                dualModelHistory.forEach(msg => {
                    if (msg.role === 'assistant') {
                        const speaker = msg.model === 'A' ? dualModelConfig.A.displayName : dualModelConfig.B.displayName;
                        combinedHistory.push(`${speaker}: ${msg.content.substring(0, 200)}`);
                    } else {
                        if (msg.type === 'third_party_discussion') {
                            combinedHistory.push(`主持人: ${msg.content.substring(0, 200)}`);
                        } else {
                            combinedHistory.push(`用户: ${msg.content}`);
                        }
                    }
                });
                
                const historyText = combinedHistory.join('\n\n');
                
                prompt = `你正在与另一个AI进行深度对话。请基于以下完整讨论历史（包含主持人发言），继续发表你的观点：

**讨论话题**：${dualModelTopic}

**完整对话历史**：
${historyText}

**当前发言者**：${speakerModel.displayName}

**要求**：
1. 参考前面所有讨论内容（包括主持人发言）
2. 如果主持人提出了观点，请识别并回应
3. 补充新论据、反驳对方观点或深化讨论
4. 保持逻辑连贯性和对话的自然延续`;
            }
            
            const loadingMsg = `[${speakerModel.displayName}] 思考中...`;
            const loadingElement = addMessage(loadingMsg, false, true); 
            loadingElement.classList.add(currentSpeaker.toLowerCase() === 'a' ? 'gemini' : 'grok', 'dual-mode');
            
            try {
                const response = await fetch(speakerModel.apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${speakerModel.apiKey}` },
                    body: JSON.stringify({ 
                        model: speakerModel.name, 
                        messages: [{ role: 'user', content: prompt }], 
                        max_tokens: 2500, 
                        temperature: 0.8,
                        stream: false
                    })
                });
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json(), 
                      reply = data.choices[0].message?.content || '';
                
                loadingElement.remove();
                const messageElement = addMessage(reply, false, false, calculateTokens(reply));
                messageElement.classList.add(currentSpeaker.toLowerCase() === 'a' ? 'gemini' : 'grok', 'dual-mode');
                messageElement.querySelector('.message-bubble').setAttribute('data-model-name', `[${speakerModel.displayName} - 第${roundCount}轮]`);
                dualModelHistory.push({ role: 'assistant', content: reply, model: currentSpeaker });
                currentSpeaker = opponentModel; 
                roundCount++; 
                updateRoundCounter();
            } catch (error) {
                loadingElement.remove(); 
                addMessage(`❌ ${speakerModel.displayName} 请求失败：${error.message}`, false);
            } finally { 
                setStatus('idle'); 
                controls.forEach(btn => btn.disabled = false); 
            }
        }

        async function summarizeDualModel() {
            if (!dualModelConfig.A.apiUrl) {
                addMessage('⚠️ 请先配置模型设置', false);
                return;
            }
            
            const summarizeBtn = document.querySelector('.control-btn:nth-child(4)'); 
            summarizeBtn.disabled = true; 
            summarizeBtn.textContent = '总结中...';
            setStatus('thinking');
            
            (async () => {
                try {
                    const aiMessages = dualModelHistory.filter(h => h.role === 'assistant');
                    const summaryPrompt = `请总结以下对话的核心观点、分歧和逻辑：

**话题**：${dualModelTopic}

**对话**：
${aiMessages.map((msg, idx) => {
    const speaker = msg.model === 'A' ? dualModelConfig.A.displayName : dualModelConfig.B.displayName;
    return `${speaker}(第${idx+1}轮): ${msg.content}`;
}).join('\n\n')}

输出: 1. 核心论点 2. 主要分歧 3. 逻辑对比 4. 未解问题`;
                    
                    const response = await fetch(dualModelConfig.A.apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${dualModelConfig.A.apiKey}` },
                        body: JSON.stringify({ 
                            model: dualModelConfig.A.name, 
                            messages: [{ role: 'user', content: summaryPrompt }], 
                            max_tokens: 1500, 
                            temperature: 0.5,
                            stream: false
                        })
                    });
                    
                    const data = await response.json(), 
                          summary = data.choices[0].message?.content || '';
                    
                    const summaryElement = addMessage(`📊 观点总结\n\n${summary}`, false);
                    summaryElement.style.background = 'rgba(74, 144, 226, 0.15)'; 
                    summaryElement.style.border = '1px solid #4A90E2';
                } catch (error) { 
                    addMessage(`❌ 总结失败: ${error.message}`, false); 
                } finally { 
                    setStatus('idle'); 
                    summarizeBtn.disabled = false; 
                    summarizeBtn.textContent = '总结观点';
                }
            })();
        }

        function endDualModelMode() {
            addMessage(`🏁 双模型对战已结束\n\n共进行了 ${roundCount-1} 轮对话\n话题：${dualModelTopic || '未命名'}`, false);
            dualModelHistory = []; 
            dualModelTopic = ''; 
            roundCount = 1; 
            updateRoundCounter(); 
            currentSpeaker = 'A';
            toggleDualModelMode();
        }

        function updateModelDisplay() { 
            const display = document.getElementById('modelNameDisplay');
            if (isDualModelMode) {
                if (dualModelConfig.A.apiUrl && dualModelConfig.B.apiUrl) {
                    display.textContent = `${dualModelConfig.A.name} vs ${dualModelConfig.B.name}`;
                } else {
                    display.textContent = '未配置对战模型';
                }
            } else {
                display.textContent = currentModel.name || '未配置';
            }
        }

        function setupInputHandling() {
            const textarea = document.getElementById('messageInput');
            
            textarea.addEventListener('input', function() { 
                this.style.height = 'auto'; 
                this.style.height = Math.min(this.scrollHeight, 200) + 'px'; 
                updateTokenCount(); 
            });
            
            textarea.addEventListener('keydown', function(e) { 
                if (e.key === 'Enter' && !e.shiftKey) { 
                    e.preventDefault(); 
                    sendMessage(); 
                } 
            });
            
            textarea.addEventListener('focus', function() {
                if (isDualModelMode) {
                    if (!dualModelTopic) {
                        showHint('智能模式：请输入讨论话题开始对战');
                    } else {
                        showHint('智能模式：现在可以加入讨论或使用控制面板');
                    }
                }
            });
            
            textarea.addEventListener('blur', hideHint);
        }

        function showHint(text) {
            const hint = document.getElementById('modeHint');
            hint.textContent = text;
            hint.classList.add('show');
            setTimeout(hideHint, 5000);
        }

        function hideHint() {
            const hint = document.getElementById('modeHint');
            hint.classList.remove('show');
        }

        function updateTokenCount() {
            const input = document.getElementById('messageInput').value || '';
            const historyTokens = conversationHistory.reduce((sum, msg) => sum + Math.ceil(msg.content.length / 4), 0);
            const inputTokens = Math.ceil(input.length / 4);
            tokenUsage = historyTokens + inputTokens;
            const percentage = Math.min((tokenUsage / 4000) * 100, 100);
            const color = percentage > 90 ? '#ff4444' : percentage > 70 ? '#ffaa00' : '#4A90E2';
            document.getElementById('tokenCount').innerHTML = `<span style="color: ${color}">${tokenUsage}/4000</span>`;
            return tokenUsage;
        }

        function calculateTokens(text) { 
            return Math.ceil(text.length / 4); 
        }

        function setStatus(status) {
            const dot = document.getElementById('statusDot'), 
                  text = document.getElementById('statusText');
            dot.className = 'status-dot';
            
            switch(status) {
                case 'idle': 
                    text.textContent = '空闲'; 
                    break;
                case 'thinking': 
                    dot.classList.add('thinking'); 
                    text.textContent = '思考中'; 
                    break;
                case 'thinking-long': 
                    dot.classList.add('thinking-long'); 
                    text.textContent = '深度思考中...'; 
                    break;
                case 'active': 
                    dot.classList.add('active'); 
                    text.textContent = '在线'; 
                    break;
            }
        }

        function addMessage(content, isUser = false, isLoading = false, tokenCount = null) {
            const chatContainer = document.getElementById('chatContainer'), 
                  messageDiv = document.createElement('div'), 
                  messageId = 'msg-' + (++messageIdCounter);
            
            messageDiv.dataset.messageId = messageId; 
            messageDiv.className = `message ${isUser ? 'user' : 'ai'}`;
            
            const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            
            if (isLoading) {
                messageDiv.innerHTML = `<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div><div class="message-footer"><span></span><span class="message-time">${time}</span></div>`;
            } else {
                const tokenDisplay = tokenCount !== null ? `<span class="token-info">${tokenCount} tokens</span>` : '<span></span>';
                
                let copyButton = '';
                if (!isUser) { 
                    copyButton = `
                        <span class="copy-btn-container">
                            <button class="copy-btn" onclick="copyMessage('${messageId}')" data-message-id="${messageId}">
                                复制
                                <span class="copy-tooltip">点击复制AI回复</span>
                            </button>
                        </span>
                    `;
                }
                
                messageDiv.innerHTML = `
                    <div class="message-bubble">${escapeHtml(content)}</div>
                    <div class="message-footer">
                        ${tokenDisplay}
                        ${copyButton}
                        <span class="message-time">${time}</span>
                    </div>
                `;
            }
            
            chatContainer.appendChild(messageDiv); 
            chatContainer.scrollTop = chatContainer.scrollHeight; 
            return messageDiv;
        }

        function copyMessage(messageId) {
            const messageElement = document.querySelector(`[data-message-id="${messageId}"]`);
            if (!messageElement) return;
            
            const bubble = messageElement.querySelector('.message-bubble');
            if (!bubble) return;
            
            const textToCopy = bubble.textContent;
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                const copyBtn = messageElement.querySelector('.copy-btn');
                if (copyBtn) {
                    const originalText = copyBtn.innerHTML;
                    copyBtn.innerHTML = '已复制<span class="copy-tooltip">内容已复制到剪贴板</span>';
                    copyBtn.classList.add('copied');
                    
                    setTimeout(() => {
                        copyBtn.innerHTML = originalText;
                        copyBtn.classList.remove('copied');
                    }, 2000);
                }
                showHint('✅ AI回复已复制到剪贴板');
            }).catch(err => {
                const textArea = document.createElement('textarea');
                textArea.value = textToCopy;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                showHint('✅ AI回复已复制到剪贴板');
            });
        }

        function escapeHtml(text) { 
            const div = document.createElement('div'); 
            div.textContent = text; 
            return div.innerHTML; 
        }

        updateSendButtonStyle();
    </script>
</body>
</html>
